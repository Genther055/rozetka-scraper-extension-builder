<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TradeScout</title>
    <style>
        body {
            width: 330px;
            padding: 12px;
            margin: 0;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            font-size: 13px;
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .brand-logo-wrapper {
            background: rgba(16, 185, 129, 0.2);
            border: 1.5px solid rgba(16, 185, 129, 0.5);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-title-group {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .brand-title {
            margin: 0;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            line-height: 1.2;
        }

        .brand-subtitle {
            margin: 0;
            font-size: 9px;
            font-weight: 700;
            color: #10b981;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1;
        }

        .version-badge {
            font-size: 9px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-weight: 700;
        }

        /* Active Tab Header */
        .tab-info-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 10px;
        }

        .tab-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .tab-info-title {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        /* Multi-tab parallel badge */
        .parallel-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.35);
            color: #a5b4fc;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 11px;
            color: #cbd5e1;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 8px;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: inherit;
            font-size: 11px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #10b981;
        }

        .button-container {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            padding: 7px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #1e293b;
            color: #e2e8f0;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #334155;
        }

        #btn-start {
            background-color: #10b981;
            color: #ffffff;
            border-color: #059669;
        }

        #btn-start:hover {
            background-color: #059669;
        }

        #btn-start:disabled {
            background-color: rgba(16, 185, 129, 0.25);
            border-color: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            cursor: not-allowed;
        }

        #btn-stop {
            background-color: #ef4444;
            color: #ffffff;
            border-color: #dc2626;
        }

        #btn-stop:hover {
            background-color: #dc2626;
        }

        #btn-stop:disabled {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            cursor: not-allowed;
        }

        /* Progress Bar Card */
        .progress-wrapper {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #0f172a;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid #334155;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981 0%, #3b82f6 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .status-details {
            font-size: 11px;
            color: #e2e8f0;
        }

        .status-action {
            font-weight: 600;
            color: #f8fafc;
            display: block;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-metrics {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="brand-container">
        <div class="brand-logo-wrapper">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="6" stroke="#10b981" stroke-width="2.5" fill="#10b981" fill-opacity="0.1" />
                <path d="M20 20L16 16" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
                <path d="M9 11L11 13L15 9" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
        <div class="brand-title-group">
            <h1 class="brand-title">TradeScout</h1>
            <span class="brand-subtitle">Parallel Scraper</span>
        </div>
        <span class="version-badge">v3.0 Multi-Tab</span>
    </div>

    <!-- Active Tab Info -->
    <div class="tab-info-card">
        <div class="tab-info-header">
            <span>Поточна вкладка:</span>
            <span id="tab-badge" style="color: #10b981;">Готова</span>
        </div>
        <span class="tab-info-title" id="tab-title">Визначення категорії...</span>
    </div>

    <!-- Parallel Tabs Indicator (Shows when other background tabs are running) -->
    <div id="parallel-badge" class="parallel-badge" style="display: none;">
        <span>⚡</span>
        <span>Паралельно у фоні: <strong id="parallel-count">0</strong> вкладок</span>
    </div>

    <div class="form-group">
        <label for="webhook-url">Адреса сервера (TradeScout):</label>
        <input type="text" id="webhook-url" placeholder="https://rozetka-scraper-extension-builder.onrender.com/api/products">
    </div>

    <div class="button-container">
        <button id="btn-start">Запустити цю вкладку</button>
        <button id="btn-stop" disabled>Зупинити</button>
    </div>

    <div class="progress-wrapper">
        <div class="progress-header">
            <span>Прогрес збору:</span>
            <span id="percent-text">0%</span>
        </div>
        
        <div class="progress-bar-bg">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <div class="status-details">
            <span class="status-action" id="status-text">Очікування запуску...</span>
            <div class="status-metrics">
                <span id="timer-text">Час: 00:00</span>
                <span id="count-text">0 товарів</span>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
