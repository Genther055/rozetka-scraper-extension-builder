<div class="relative min-h-screen flex items-center justify-center bg-slate-950 overflow-hidden font-sans">
  <!-- Glowing background blobs -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl animate-pulse delay-1000"></div>

  <div class="relative w-full max-w-md p-8 bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl shadow-2xl">
    <!-- Header/Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-xl mb-4 shadow-lg shadow-indigo-600/30">
        <span class="material-icons text-white text-3xl font-bold">query_stats</span>
      </div>
      <h2 class="text-3xl font-bold tracking-tight text-white">TradeScout</h2>
      <p class="mt-2 text-sm text-slate-400">Платформа аналітики маркетплейсів</p>
    </div>

    <!-- Login Form -->
    <form (submit)="onLogin()" class="space-y-6">
      <div *ngIf="errorMessage" class="p-3 bg-red-950/50 border border-red-800 text-red-400 text-xs rounded-lg text-center animate-shake">
        {{ errorMessage }}
      </div>

      <div>
        <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Логін</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <span class="material-icons text-lg">person</span>
          </span>
          <input
            id="username"
            name="username"
            type="text"
            required
            [(ngModel)]="username"
            class="block w-full pl-10 pr-3 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 text-sm transition-all"
            placeholder="Введіть логін (admin)"
          />
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Пароль</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <span class="material-icons text-lg">lock</span>
          </span>
          <input
            id="password"
            name="password"
            type="password"
            required
            [(ngModel)]="password"
            class="block w-full pl-10 pr-3 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 text-sm transition-all"
            placeholder="Введіть пароль (admin)"
          />
        </div>
      </div>

      <button
        type="submit"
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-indigo-500 cursor-pointer shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/30 transition-all"
      >
        Увійти в систему
      </button>
    </form>

    <!-- Footer info -->
    <div class="mt-8 text-center text-xs text-slate-500 border-t border-slate-800/80 pt-6">
      Розроблено для локального аналізу Rozetka & Prom
    </div>
  </div>
</div>
